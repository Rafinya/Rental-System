<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d4edd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff85a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded container background -->
  <rect width="512" height="512" rx="128" fill="#1e1836" />
  <!-- Elegant apartment building shape -->
  <g fill="url(#grad)">
    <!-- Base -->
    <rect x="96" y="400" width="320" height="32" rx="8" />
    <!-- Main building body -->
    <rect x="144" y="128" width="224" height="272" rx="16" />
    <!-- Roof details -->
    <rect x="224" y="96" width="64" height="32" rx="4" />
  </g>
  <!-- Windows -->
  <g fill="#1e1836">
    <!-- Row 1 -->
    <rect x="176" y="160" width="32" height="48" rx="6" />
    <rect x="240" y="160" width="32" height="48" rx="6" />
    <rect x="304" y="160" width="32" height="48" rx="6" />
    <!-- Row 2 -->
    <rect x="176" y="230" width="32" height="48" rx="6" />
    <rect x="240" y="230" width="32" height="48" rx="6" />
    <rect x="304" y="230" width="32" height="48" rx="6" />
    <!-- Row 3 -->
    <rect x="176" y="300" width="32" height="48" rx="6" />
    <rect x="240" y="300" width="32" height="48" rx="6" />
    <rect x="304" y="300" width="32" height="48" rx="6" />
  </g>
</svg>
