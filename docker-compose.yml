version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weenaloft-rental-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./rental_system.db:/app/rental_system.db
      - ./Rent Agreement:/app/Rent Agreement
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
