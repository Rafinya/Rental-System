<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Weena Loft Rental Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#111312;--s1:#1B1D1A;--s2:#252822;--sage:#A0A99A;--gold:#D6B16B;--ivory:#F4F0E7;--mut:#A9AAA2;--bd:rgba(220,215,194,.14);--bad:#E58A7A;--ok:#9CC496;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#E7E9E3;--s1:#F6F4EE;--s2:#DDE0D8;--sage:#5E6B5A;--gold:#8A6420;--ivory:#1B1D1A;--mut:#5C5E56;--bd:rgba(40,40,30,.18);--bad:#B2402F;--ok:#3F7A3A}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ivory);font:14px/1.5 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--s1);z-index:30}
h1,h2,h3,.num,.brand b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0}
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--s1);border-right:1px solid var(--bd);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center}.brand img{width:34px;height:44px;object-fit:cover;border-radius:3px}.brand b{font-size:21px;letter-spacing:.06em;display:block;line-height:1}.brand small{color:var(--gold);font-size:11px}
nav a{display:block;padding:9px 12px;border-radius:6px;color:var(--mut);text-decoration:none;border-left:2px solid transparent}
nav a:hover{color:var(--ivory)}nav a[aria-current]{color:var(--ivory);background:var(--s2);border-left-color:var(--gold)}
.foot{margin-top:auto;color:var(--mut);font-size:12px}
main{padding:28px clamp(16px,3vw,40px);min-width:0;max-width:1280px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;background:#111312;color:#F4F0E7;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:22px}
.hero>div{padding:32px}.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.05}.hero p{color:#A9AAA2;max-width:44ch}.hero .eye{margin:0 0 8px}
.logo{display:block;width:100%;height:100%;object-fit:cover}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button{font:inherit;cursor:pointer;border-radius:6px;padding:9px 16px;border:1px solid var(--bd);min-height:40px}
.b1{background:var(--gold);color:#1B1408;border-color:var(--gold);font-weight:600}.b2{background:transparent;color:var(--ivory)}.b3{background:none;color:var(--gold);padding:4px 8px;min-height:32px;border:0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:16px}.kp .card .num{font-size:38px;line-height:1.1;color:var(--ivory)}.kp small{color:var(--mut)}.kp .hi .num{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}h2{font-size:26px;margin-bottom:10px}h3{font-size:20px;margin-bottom:8px}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--gold)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-weight:500;color:var(--mut);text-align:left;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:middle}.ra{text-align:right;white-space:nowrap}
.st,.im{font-weight:500;white-space:nowrap}
.s-Occupied{color:var(--ok)}.s-Vacant{color:var(--mut)}.s-Maintenance{color:var(--gold)}.i-High{color:var(--bad);font-weight:700}.i-Medium{color:var(--gold)}.i-Low{color:var(--sage)}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fb input,.fb select,form input,form select,form textarea{background:var(--s2);color:var(--ivory);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;font:inherit;min-height:40px;width:100%}.fb input,.fb select{width:auto;min-width:150px}
.set{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:12px 40px;border-top:1px solid var(--bd);padding:24px 0}.set h3{margin:0}.set p{color:var(--mut);margin:4px 0 0;max-width:34ch}.set form+form,.set .tl+form{margin-top:12px}.set input:disabled{opacity:.65}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row small{color:var(--mut)}.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow input{flex:1;min-width:180px}.sec{border-top:1px solid var(--bd);padding:14px 0 6px}.sum{font:500 clamp(20px,2.4vw,27px)/1.4 'Cormorant Garamond',Georgia,serif;max-width:62ch;margin:0 0 24px}.sum b{color:var(--gold);font-weight:600}.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--bd);border-radius:8px}
.bw{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:20px}.bld{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:linear-gradient(var(--s2),var(--s1))}
.bf{display:flex;align-items:center;gap:10px;background:var(--s1);color:var(--ivory);min-height:64px;justify-content:flex-start;text-align:left}.bf.on{border-color:var(--gold);border-left:4px solid var(--gold)}.fn{width:60px;color:var(--mut);font-size:12px}.wins{display:flex;gap:4px;flex-wrap:wrap}.wins em{color:var(--mut);font-size:12px}
.w{width:16px;height:22px;border-radius:2px;border:1px solid var(--bd)}.w-Occupied{background:#C9A25E}.w-Vacant{background:transparent;border-color:var(--sage)}.w-Maintenance{background:repeating-linear-gradient(45deg,var(--gold) 0 3px,transparent 3px 6px);border-color:var(--gold)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.chip{background:var(--s2);color:var(--ivory);text-align:left;display:block;padding:10px}.chip b{font-size:16px}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:12px}#modal[hidden]{display:none}.mb{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.m{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g label{display:block;color:var(--mut);font-size:12px}.g .w{grid-column:1/-1}.g input[type=checkbox]{width:auto;min-height:0}.err{display:block;color:var(--bad);min-height:0}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#1B1408;padding:10px 18px;border-radius:6px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
ul.tl{list-style:none;margin:0;padding:0}ul.tl li{padding:6px 0;border-bottom:1px solid var(--bd);color:var(--mut)}ul.tl b{color:var(--ivory);font-weight:500}textarea.csv{height:220px;font-family:monospace}
@media(max-width:800px){#app{display:block}aside{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;z-index:20}nav{display:flex;gap:2px}nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav a[aria-current]{border-bottom-color:var(--gold)}.foot,.brand div{display:none}.hero,.two,.bw,.g,.set{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="two"><div class="sec"><h3>Floors</h3>${fls.map(n=>{const s=fst(n);return`<div><b>${esc(fl(n))}</b> <small style="color:var(--mut)">${pl(s.t,'unit')}, ${s.o} occupied, ${s.v} vacant, ${s.m} under maintenance</small><div class="bar" role="img" aria-label="${s.p}% occupied"><i style="width:${s.p}%"></i></div></div>`}).join('')}</div>
<div class="sec"><h3>Urgent repairs</h3>${hi.length?`<ul class="tl">${hi.map(rrow).join('')}</ul>`:empty('No urgent repairs are open.')}</div></div>
<div class="two"><div class="sec"><h3>Newest tenants</h3>${S.tenants.length?`<ul class="tl">${S.tenants.slice(-5).reverse().map(t=>`<li><b>${esc(t.name)}</b>, unit ${esc(uno(t.unit))}, from ${fd(t.start)}</li>`).join('')}</ul>`:empty('No tenants registered yet.')}</div>
<div class="sec"><h3>Recent activity</h3>${S.log.length?`<ul class="tl">${S.log.slice(0,6).map(l=>`<li><b>${esc(l.m)}</b>, ${fd(l.t)}</li>`).join('')}</ul>`:empty('Your latest changes will appear here.')}</div></div>`}
function building(){const us=live().filter(u=>u.floor===F.fl).sort(cmpU),s=fst(F.fl);
return`<h2>Building &amp; floors</h2><div class="bw"><div class="bld" role="group" aria-label="Floor selector">${[4,3,2,1].map(n=>{const x=live().filter(u=>u.floor===n).sort(cmpU);return`<button class="bf ${F.fl===n?'on':''}" data-a="fl" data-id="${n}" aria-pressed="${F.fl===n}"><span class="fn">${esc(fl(n))}</span><span class="wins">${x.length?x.map(u=>`<i class="w w-${stat(u)}" title="${esc(u.no)}: ${stat(u)}"></i>`).join(''):'<em>No units yet</em>'}</span></button>`}).join('')}<small style="color:var(--mut)">Solid block: occupied. Striped block: under maintenance. Empty outline: vacant.</small></div>
<div class="card"><h3>${esc(fl(F.fl))}</h3><p>${s.t} units, ${s.o} occupied, ${s.v} vacant, ${s.m} under maintenance, ${s.p}% occupancy</p><div class="bar"><i style="width:${s.p}%"></i></div>${us.length?`<div class="chips">${us.map(u=>`<button class="chip" data-a="uv" data-id="${u.id}"><b>${esc(u.no)}</b><br>${badge(stat(u))}<br><small>${actT(u)?esc(actT(u).name):esc(u.type)}</small></button>`).join('')}</div>`:empty('No units on this floor yet.')}<div class="act"><button class="b1" data-a="addU">Add unit to this floor</button></div></div></div>`}
const unitsPage=()=>`<h2>Units</h2><div class="fb"><input data-f="uq" value="${esc(F.uq)}" placeholder="Search unit number" aria-label="Search units">${sel('uf',flo())}${sel('us',[['Vacant','Vacant'],['Occupied','Occupied'],['Maintenance','Under maintenance']])}<button class="b1" data-a="addU">Add unit</button></div><div id="res">${uRes()}</div>`;
function uRes(){const q=F.uq.toLowerCase(),L=live().filter(u=>(!q||u.no.toLowerCase().includes(q))&&(!F.uf||u.floor==F.uf)&&(!F.us||stat(u)===F.us)).sort(cmpU);
return L.length?`<div class="tw"><table><thead><tr><th>Unit</th><th>Floor</th><th>Type</th><th>Rent</th><th>Status</th><th>Tenant</th><th></th></tr></thead><tbody>${L.map(u=>`<tr><td><b>${esc(u.no)}</b></td><td>${esc(fl(u.floor))}</td><td>${esc(u.type)}</td><td>${kes(u.rent)}</td><td>${badge(stat(u))}</td><td>${actT(u)?esc(actT(u).name):'—'}</td><td class="ra"><button class="b3" data-a="uv" data-id="${u.id}">View</button><button class="b3" data-a="editU" data-id="${u.id}">Edit</button><button class="b3" data-a="arcU" data-id="${u.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:empty('No units match. Use “Add unit” to register your building’s apartments.')}
const tenantsPage=()=>`<h2>Tenants</h2><div class="fb"><input data-f="tq" value="${esc(F.tq)}" placeholder="Name, phone or unit" aria-label="Search tenants">${sel('ts',[['active','Active'],['ended','Moved out']])}<button class="b1" data-a="addT">Add tenant</button></div><div id="res">${tRes()}</div>`;
function tRes(){const q=F.tq.toLowerCase(),L=S.tenants.filter(t=>(!F.ts||(F.ts==='active')===!t.end)&&(!q||(t.name+t.phone+uno(t.unit)).toLowerCase().includes(q)));
return L.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Phone</th><th>Unit</th><th>ID</th><th>Tenancy</th><th></th></tr></thead><tbody>${L.map(t=>`<tr><td><b>${esc(t.name)}</b><br><small style="color:var(--mut)">${esc(t.email||'')}</small></td><td>${esc(t.phone)}</td><td>${esc(uno(t.unit))}</td><td>${t.nid?'•••• '+esc(t.nid.slice(-3)):'—'}</td><td>${fd(t.start)} – ${t.end?fd(t.end):'present'}</td><td class="ra">${t.end?'':`<button class="b3" data-a="editT" data-id="${t.id}">Edit</button><button class="b3" data-a="endT" data-id="${t.id}">Record departure</button>`}</td></tr>`).join('')}</tbody></table></div>`:empty('No tenants found. Add a tenant to assign them to a vacant unit.')}
const repairsPage=()=>`<h2>Repairs &amp; maintenance</h2><div class="fb"><input data-f="rq" value="${esc(F.rq)}" placeholder="Search title or unit" aria-label="Search repairs">${sel('ri',['High','Medium','Low'].map(x=>[x,x]))}${sel('rs',['Reported','Acknowledged','In Progress','On Hold','Completed','Cancelled'].map(x=>[x,x]))}${sel('rf',flo())}<button class="b1" data-a="addR">Report repair</button></div><div id="res">${rRes()}</div>`;
function rRes(){const q=F.rq.toLowerCase(),L=S.repairs.filter(r=>(!F.ri||r.impact===F.ri)&&(!F.rs||r.status===F.rs)&&(!F.rf||(S.units.find(u=>u.id===r.unit)||{}).floor==F.rf)&&(!q||(r.title+uno(r.unit)).toLowerCase().includes(q))).sort((a,b)=>openR(b)-openR(a)||ordn(a)-ordn(b)||b.date.localeCompare(a.date));
return L.length?`<div class="tw"><table><thead><tr><th>Impact</th><th>Repair</th><th>Unit</th><th>Reported</th><th>Status</th><th>Cost</th><th></th></tr></thead><tbody>${L.map(r=>`<tr><td>${imp(r.impact)}</td><td><b>${esc(r.title)}</b><br><small style="color:var(--mut)">${esc(r.cat)}${r.worker?', '+esc(r.worker):''}</small></td><td>${esc(uno(r.unit))}</td><td>${fd(r.date)}</td><td><select data-st="${r.id}" aria-label="Status of ${esc(r.title)}">${['Reported','Acknowledged','In Progress','On Hold','Completed','Cancelled'].map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select></td><td>${r.act||r.est?kes(r.act||r.est):'—'}</td><td class="ra"><button class="b3" data-a="rv" data-id="${r.id}">Details</button><button class="b3" data-a="editR" data-id="${r.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`:empty('No repairs found. Report a repair to start tracking it.')}
function reports(){const R=S.repairs,c=(f)=>R.filter(f).length,cost=R.filter(r=>r.status==='Completed').reduce((a,r)=>a+(+r.act||0),0);
return`<h2>Reports</h2><div class="two"><div class="sec"><h3>Occupancy by floor</h3><table><thead><tr><th>Floor</th><th>Units</th><th>Occupied</th><th>Vacant</th><th>Rate</th></tr></thead><tbody>${fls.map(n=>{const s=fst(n);return`<tr><td>${esc(fl(n))}</td><td>${s.t}</td><td>${s.o}</td><td>${s.v}</td><td>${s.p}%</td></tr>`}).join('')}</tbody></table></div>
<div class="sec"><h3>Repairs by impact and status</h3><table><tbody>${['High','Medium','Low'].map(i=>`<tr><td>${imp(i)}</td><td>${c(r=>r.impact===i)} total, ${c(r=>r.impact===i&&openR(r))} open</td></tr>`).join('')}${['Reported','Acknowledged','In Progress','On Hold','Completed','Cancelled'].map(s=>`<tr><td>${s}</td><td>${c(r=>r.status===s)}</td></tr>`).join('')}<tr><td><b>Completed repair cost</b></td><td>${kes(cost)}</td></tr></tbody></table></div></div>
<div class="sec"><h3>Spreadsheet lists</h3><p style="color:var(--mut)">Pick a list, copy it, and paste it into Excel or Google Sheets. ID numbers are never included.</p><div class="act"><button class="b2" data-a="csv" data-id="units">Units</button><button class="b2" data-a="csv" data-id="tenants">Tenants &amp; history</button><button class="b2" data-a="csv" data-id="repairs">Repairs</button></div></div>`}
const sf=(n,l,v,w)=>`<label${w?' class="w"':''}>${l}<input name="${n}" value="${esc(v)}"><small class="err" data-e="${n}"></small></label>`;
const sect=(h,d,b)=>`<section class="set"><div><h3>${h}</h3><p>${d}</p></div><div>${b}</div></section>`;
const lst=(k,label,items,used)=>`<ul class="tl">${items.map((x,i)=>`<li class="row"><span><b>${esc(x)}</b>${used(x)?` <small>(used by ${used(x)})</small>`:''}</span><button type="button" class="b3" data-a="delL" data-id="${k}:${i}">Remove</button></li>`).join('')}</ul><form class="addrow" data-form="addL" data-k="${k}"><input name="v" aria-label="${label}" placeholder="${label}"><button class="b2">Add</button><small class="err" data-e="v" style="width:100%"></small></form>`;
const settings=()=>`<h2>Settings</h2>`+
sect('Property','Your building’s name and contact details.',`<form data-form="saveP"><div class="g">${sf('sn','Property name',S.cfg.name,1)}${sf('sp','Phone',S.cfg.phone||'')}${sf('se','Email',S.cfg.email||'')}${sf('sa','Address (optional)',S.cfg.address||'',1)}<label>Currency<input value="Kenya shillings (KES)" disabled></label></div><div class="act"><button class="b1">Save property details</button></div></form>`)+
sect('Floor names','Rename the four floors, for example Ground or Level 1.',`<form data-form="saveF"><div class="g">${fls.map(n=>sf('f'+n,'Floor '+n,fl(n))).join('')}</div><div class="act"><button class="b1">Save floor names</button></div></form>`)+
sect('Unit types','The choices offered when you add a unit.',lst('types','New unit type',S.cfg.types,x=>{const n=S.units.filter(u=>u.type===x).length;return n?n+(n===1?' unit':' units'):''}))+
sect('Repair categories','The choices offered when you report a repair.',lst('cats','New repair category',S.cfg.cats,x=>{const n=S.repairs.filter(r=>r.cat===x).length;return n?n+(n===1?' repair':' repairs'):''}))+
sect('Your records','Everything you enter is kept on this device only. Deleting cannot be undone.',`<button class="b2" data-a="reset">Delete all records</button>`);
/* ---------- wiring ---------- */
const P={overview,building,units:unitsPage,tenants:tenantsPage,repairs:repairsPage,reports,settings},RES={units:uRes,tenants:tRes,repairs:rRes};
const NAV=[['overview','Overview'],['building','Building & Floors'],['units','Units'],['tenants','Tenants'],['repairs','Repairs & Maintenance'],['reports','Reports'],['settings','Settings']];
function go(){let p=location.hash.slice(1);if(!P[p])p='overview';page=p;$('#nav').innerHTML=NAV.map(n=>`<a href="#${n[0]}"${n[0]===p?' aria-current="page"':''}>${esc(n[1])}</a>`).join('');$('#main').innerHTML=P[p]()}
const csv=rows=>rows.map(r=>r.map(v=>{v=String(v??'').replace(/[\t\r\n]+/g,' ');if(/^[=@]/.test(v))v="'"+v;return v}).join('\t')).join('\n');
const A={x:close,addU:()=>unitForm(),addT:id=>tenantForm(null,id),addR:()=>repairForm(),fl:id=>{F.fl=+id;go()},
editU:id=>unitForm(S.units.find(u=>u.id===id)),editT:id=>tenantForm(S.tenants.find(t=>t.id===id)),editR:id=>repairForm(S.repairs.find(r=>r.id===id)),
arcU:id=>{const u=S.units.find(x=>x.id===id);if(actT(u)){toast('Record the tenant’s departure first.');return}confirmBox('Remove unit '+esc(u.no)+' from the active list? Its tenant and repair history is kept.',()=>{u.arch=true;logA('Unit '+u.no+' removed from the active list')})},
endT:id=>{const t=S.tenants.find(x=>x.id===id);confirmBox('Record departure of '+esc(t.name)+' today? The tenancy stays in history and unit '+esc(uno(t.unit))+' becomes vacant.',()=>{t.end=today();logA(t.name+' moved out of unit '+uno(t.unit))})},
uv:id=>{const u=S.units.find(x=>x.id===id),t=actT(u);modal('Unit '+u.no,`<p>${esc(fl(u.floor))}, ${esc(u.type)}, ${kes(u.rent)} ${badge(stat(u))}</p><p>${esc(u.desc||'')} ${esc(u.notes||'')}</p><h3>Tenant history</h3>${S.tenants.some(x=>x.unit===id)?`<ul class="tl">${S.tenants.filter(x=>x.unit===id).map(x=>`<li><b>${esc(x.name)}</b>, ${fd(x.start)} – ${x.end?fd(x.end):'present'}</li>`).join('')}</ul>`:empty('No tenants yet.')}<h3>Repairs by impact and status</h3>${S.repairs.some(r=>r.unit===id)?`<ul class="tl">${S.repairs.filter(r=>r.unit===id).map(rrow).join('')}</ul>`:empty('No repairs recorded.')}<div class="act"><button class="b2" data-a="x">Close</button>${t?'':`<button class="b1" data-a="addT" data-id="${id}">Assign tenant</button>`}</div>`)},
rv:id=>{const r=S.repairs.find(x=>x.id===id);modal(r.title,`<p>${imp(r.impact)} ${r.status}, unit ${esc(uno(r.unit))}, ${esc(r.cat)}</p><p>${esc(r.desc)}</p><p style="color:var(--mut)">Estimated ${kes(r.est)}, Actual ${kes(r.act)}, Due ${fd(r.due)}</p><h3>History</h3><ul class="tl">${r.h.map(h=>`<li><b>${esc(h.m)}</b>, ${fd(h.t)}</li>`).join('')}</ul><div class="act"><button class="b2" data-a="x">Close</button></div>`)},
csv:id=>{const rows=id==='units'?[['Unit','Floor','Type','Rent (KES)','Status','Tenant'],...live().sort(cmpU).map(u=>[u.no,fl(u.floor),u.type,u.rent,stat(u),actT(u)?actT(u).name:''])]:id==='tenants'?[['Name','Phone','Email','Unit','Start','End'],...S.tenants.map(t=>[t.name,t.phone,t.email,uno(t.unit),t.start,t.end||''])]:[['Title','Unit','Impact','Status','Category','Reported','Est. cost','Actual cost'],...S.repairs.map(r=>[r.title,uno(r.unit),r.impact,r.status,r.cat,r.date,r.est,r.act])];
modal(({units:'Units',tenants:'Tenants',repairs:'Repairs'})[id]+' list',`<p style="color:var(--mut)">Copy these rows and paste them into Excel or Google Sheets.</p><textarea class="csv" id="csvt" readonly>${esc(csv(rows))}</textarea><div class="act"><button class="b2" data-a="x">Close</button><button class="b1" data-a="cp">Copy list</button></div>`)},
cp:()=>{const t=$('#csvt');t.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Select the text and copy it manually.')}},
saveP:f=>{const v=n=>f.elements[n].value.trim(),er={};if(!v('sn'))er.sn='Enter the property name.';if(v('sp')&&!PH.test(v('sp')))er.sp='Enter a valid phone number.';if(v('se')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('se')))er.se='Enter a valid email address.';if(showErr(f,er))return;Object.assign(S.cfg,{name:v('sn'),phone:v('sp'),email:v('se'),address:v('sa')});persist();go();toast('Property details saved')},
saveF:f=>{const nm=fls.map(n=>f.elements['f'+n].value.trim()),er={};nm.forEach((x,i)=>{if(!x)er['f'+(i+1)]='Enter a name.';else if(nm.indexOf(x)!==i)er['f'+(i+1)]='Each floor needs a different name.'});if(showErr(f,er))return;S.floors=nm;persist();go();toast('Floor names saved')},
addL:f=>{const k=f.dataset.k,v=f.elements.v.value.trim(),er={};if(!v)er.v='Type a name first.';else if(S.cfg[k].some(x=>x.toLowerCase()===v.toLowerCase()))er.v='This is already in the list.';if(showErr(f,er))return;S.cfg[k].push(v);persist();go();toast('Added')},
delL:id=>{const[k,i]=id.split(':'),x=S.cfg[k][+i];if(S.cfg[k].length<2){toast('Keep at least one choice in the list.');return}if(k==='types'?S.units.some(u=>u.type===x):S.repairs.some(r=>r.cat===x)){toast('This choice is still in use, so it can’t be removed.');return}S.cfg[k].splice(+i,1);persist();go();toast('Removed')},
reset:()=>confirmBox('Delete every unit, tenant and repair record on this device? This cannot be undone.',()=>{S.units=[];S.tenants=[];S.repairs=[];S.log=[]})};
const showErr=(f,er)=>{f.querySelectorAll('[data-e]').forEach(x=>x.textContent=er[x.dataset.e]||'');const k=Object.keys(er)[0];if(k&&f.elements[k])f.elements[k].focus();return!!k};
document.addEventListener('submit',e=>{const n=e.target.dataset.form;if(n&&A[n]){e.preventDefault();A[n](e.target)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(b.dataset.a==='addT'&&!$('#modal').hidden)close();A[b.dataset.a](b.dataset.id)}});
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k){F[k]=e.target.value;$('#res').innerHTML=RES[page]()}});
document.addEventListener('change',e=>{const id=e.target.dataset.st;if(!id)return;const r=S.repairs.find(x=>x.id===id),s=e.target.value;if(r.status===s)return;r.h.unshift({t:new Date().toISOString(),m:`Status changed from ${r.status} to ${s}`});r.status=s;if(s==='Completed'&&!r.done)r.done=today();logA('Repair “'+r.title+'” moved to '+s);persist();go();toast('Status updated')});
document.addEventListener('keydown',e=>{const m=$('#modal');if(m.hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const f=[...m.querySelectorAll('input,select,textarea,button')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
addEventListener('hashchange',go);go();
</script></body></html>
